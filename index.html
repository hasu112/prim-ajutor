<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testări Prim Ajutor Calificat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: o singură coloană de lucru (max 760px), ca o fișă de intervenție; antet lipicios cu progresul. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#13233A; --muted:#58677C; --line:#D3DBE5;
  --accent:#C4122F; --accent-soft:#FBE7EA; --amber:#B86A00; --amber-soft:#FFF3DF;
  --ok:#1D7A47; --ok-soft:#E3F4EA; --bad:#B3261E; --bad-soft:#FCE8E6; --chip:#E3E9F0; --panel:#13233A; --panel-fg:#EDF1F5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --surface:#16233A; --ink:#E7EDF5; --muted:#9AA9BE; --line:#2A3A55;
  --accent:#FF5A6E; --accent-soft:#3A1A24; --amber:#F2B04A; --amber-soft:#3A2B12;
  --ok:#5BD08F; --ok-soft:#123324; --bad:#FF8A80; --bad-soft:#3B1717; --chip:#22314B; --panel:#1E3150; --panel-fg:#E7EDF5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1726; --surface:#16233A; --ink:#E7EDF5; --muted:#9AA9BE; --line:#2A3A55;
  --accent:#FF5A6E; --accent-soft:#3A1A24; --amber:#F2B04A; --amber-soft:#3A2B12;
  --ok:#5BD08F; --ok-soft:#123324; --bad:#FF8A80; --bad-soft:#3B1717; --chip:#22314B; --panel:#1E3150; --panel-fg:#E7EDF5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);color:var(--panel-fg)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;flex:none;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;letter-spacing:0;text-transform:none;opacity:.75;margin-top:3px}
.top .sp{flex:1}
.top button{background:transparent;border:1px solid color-mix(in srgb,var(--panel-fg) 35%,transparent);color:var(--panel-fg);font:inherit;font-size:14px;padding:6px 14px;min-height:44px;border-radius:6px;cursor:pointer}
.progressbar{height:4px;background:color-mix(in srgb,var(--panel-fg) 20%,transparent)}
.progressbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,42px);letter-spacing:.01em}
h2{font-size:26px}
h3{font-size:20px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--accent)}
.muted{color:var(--muted)}
.hero{padding-block:28px 18px;display:grid;gap:12px}
.hero p{margin:0;max-width:62ch}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.namebox label{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 200px;max-width:320px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px;flex:1}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.exam{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);color:var(--panel-fg);border-radius:12px;padding:16px 18px;margin-block:8px 22px}
.exam h3{font-size:22px}
.exam p{margin:2px 0 0;opacity:.8;font-size:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.light{background:var(--panel-fg);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.chapters{display:grid;gap:8px}
.ch{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.ch:hover{border-color:var(--muted)}
.ch .num{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.ch .t{min-width:0}
.ch .t b{display:block;font-size:16px;line-height:1.3}
.ch .t span{font-size:13px;color:var(--muted)}
.score-pill{font-family:var(--display);font-weight:600;font-size:15px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.score-pill.good{background:var(--ok-soft);color:var(--ok)}
.score-pill.mid{background:var(--amber-soft);color:var(--amber)}
.score-pill.low{background:var(--bad-soft);color:var(--bad)}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:16px 0 6px}
.chhead{padding-block:6px 16px;display:grid;gap:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:22px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px;align-content:start;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--display);font-size:21px}
.mode span{font-size:14px;color:var(--muted)}
.mode .k{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--accent)}
.keypts{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.keypts ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;margin-top:14px}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qtext{font-size:19px;font-weight:700;line-height:1.4}
.multi{display:inline-block;font-size:12px;font-weight:700;background:var(--amber-soft);color:var(--amber);padding:2px 8px;border-radius:99px;margin-bottom:6px}
.multi.src{background:var(--chip);color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:11px 12px;cursor:pointer;line-height:1.4}
.opt .l{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--chip);color:var(--muted)}
.opt.sel{border-color:var(--ink)}
.opt.sel .l{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb.info{background:var(--amber-soft)}
.fb b.v{font-family:var(--display);font-size:20px}
.fb.ok b.v{color:var(--ok)} .fb.no b.v{color:var(--bad)} .fb.info b.v{color:var(--amber)}
.fb p{margin:0}
.ref{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.scene{background:var(--panel);color:var(--panel-fg);border-radius:12px;padding:18px 20px;display:grid;gap:8px}
.scene .eyebrow{color:color-mix(in srgb,var(--accent) 70%,#fff)}
.scene p{margin:0}
.vitals{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.vitals span{font-size:13px;background:color-mix(in srgb,var(--panel-fg) 14%,transparent);padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.discuss{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:0 10px 10px 0;padding:14px 16px;display:grid;gap:8px}
.discuss b{font-family:var(--display);font-size:18px;color:var(--amber)}
.discuss ul{margin:0;padding-left:20px;display:grid;gap:4px}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding-block:24px 8px}
.big{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:24px;font-weight:600}
.review{display:grid;gap:10px;margin-top:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.rv .a{color:var(--ok);font-weight:700}
.rv .y{color:var(--bad)}
.toast{font-size:13px;color:var(--muted)}
footer{margin-top:36px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

.syncnote{font-size:13px;color:var(--muted);margin:8px 0 0}
.person{display:grid;gap:0}
.person.open .ch{border-bottom-left-radius:0;border-bottom-right-radius:0}
.pdet{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:4px 14px 14px}
.pdet h3{font-size:15px;margin:12px 0 8px}
.pdet .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pdet .cell{background:var(--chip);border-radius:8px;padding:6px 4px;text-align:center;display:grid;font-variant-numeric:tabular-nums}
.pdet .cell b{font-size:12px;color:var(--muted)} .pdet .cell span{font-size:14px;font-weight:700}
.pdet .cell.good{background:var(--ok-soft);color:var(--ok)} .pdet .cell.mid{background:var(--amber-soft);color:var(--amber)} .pdet .cell.low{background:var(--bad-soft);color:var(--bad)}
.loglist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.loglist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.loglist li i{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--muted)}
@media (max-width:420px){.brand{font-size:18px}.brand small{display:none}}
@media (max-width:480px){.qtext{font-size:17px}.card{padding:16px}.big{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
window.CHAPTERS=[];var CHAPTERS=window.CHAPTERS;
CHAPTERS.push({
id:1, title:"Sistemul de asistență medicală de urgență (SMU)", pages:"9–21",
keypoints:[
"Verigile SMU: acces (112), primul ajutor, defibrilare precoce, asistența medicală de urgență, spital, plus comunicațiile care le leagă.",
"112 e gratuit, disponibil 24/24, apelabil din orice rețea, chiar cu telefonul blocat. 113 e numărul pentru SMS-uri de urgență (persoane cu deficiențe de auz/vorbire).",
"Timpi maximi de sosire pentru primul ajutor calificat: 8 minute în urban (90% din cazuri), 12 minute în rural (75% din cazuri). Pentru echipajele medicale: 15 min urban, 20 min rural.",
"Echipajul de prim ajutor (EPA): 3 pompieri paramedici: paramedic 1 comandant, paramedic 2 servant, paramedic 3 conducător auto.",
"Prima lecție a salvatorului: <b>să știi ce NU trebuie să faci</b>.",
"Fișa prespitalicească se completează pentru fiecare pacient, integral, și devine act medico-legal după completare.",
"Numai medicul poate constata decesul și lăsa aparținătorilor scrisoarea medicală de constatare.",
"Transport simplu / prompt / rapid: rapid = pacient foarte grav, nu poate fi stabilizat la fața locului."
],
questions:[
{m:1,q:"Care sunt verigile care formează Sistemul Medical de Urgență (SMU)?",o:["spital, defibrilare precoce, primul ajutor","asistența medicală de urgență, spital, acces","acces, defibrilare precoce, spital, asistența medicală de urgență","acces, primul ajutor, defibrilare precoce, asistența medicală de urgență, spital, comunicații"],a:[3],e:"SMU e urmărit ca un traseu al pacientului: acces (112) → primul ajutor → defibrilare precoce → asistență medicală de urgență → spital, toate legate prin comunicații.",r:"1.1"},
{m:1,q:"Numărul de urgență 112 este:",o:["gratuit în orice rețea, greu de apelat, ușor de reținut","ușor de reținut, ușor de apelat, disponibil doar 12 ore pe zi","disponibil 24 din 24, ușor de reținut, apelabil din orice rețea, poate fi apelat și cu telefonul blocat","ușor de reținut, disponibil 24 din 24, apelabil din orice rețea, nu poate fi apelat cu telefonul blocat"],a:[2],e:"112 este universal și gratuit, se poate apela din orice rețea fixă sau mobilă, chiar dacă telefonul este blocat, iar operatorii răspund 24 din 24 de ore.",r:"1.1 Acces"},
{m:1,q:"Fișa prespitalicească:",o:["trebuie completată pentru fiecare victimă, nu este act medico-legal, rubricile se completează integral","rubricile se completează obligatoriu și integral, este act medico-legal, la accident colectiv fiecare echipaj completează fișa pentru pacienții asistați direct","la accident colectiv fiecare echipaj completează fișa pentru pacienții asistați direct, este act medico-legal, nu trebuie completată pentru fiecare victimă","se completează aleatoriu, fiecare fișă are atașat obligatoriu un traseu de monitor"],a:[1],e:"Fișa se completează pentru fiecare pacient asistat, toate rubricile, și devine act medico-legal după completare. La accidentul colectiv fiecare echipaj completează fișele pacienților asistați direct de el.",r:"1.2 Fișa prespitalicească"},
{m:1,q:"Atitudinea paramedicului față de victimă trebuie să fie:",o:["fără compasiune, umil, serviabil","ton calm și consecvent, empatie, fără să anunțe vreo manevră","anunță fiecare manevră, fără empatie, agitat","empatie, ton calm și consecvent, arată interes"],a:[3],e:"Salvatorul dă dovadă de empatie, acționează calm și consecvent, arată interes față de relatările pacientului și îl informează despre tot ce urmează să i se facă.",r:"1.2 Comunicarea cu pacienții"},
{m:1,q:"Ca echipaj de prim ajutor aveți următoarele îndatoriri:",o:["să vă protejați, să nu evaluați pacientul, să mobilizați pacientul indiferent de situație","să solicitați asistență specializată, să răspundeți prompt, să asigurați îngrijirile și să nu reevaluați pacientul","să vă protejați, să ajungeți lângă pacient, să răspundeți prompt prin prezentare la locul solicitării","să ajungeți lângă pacient, să nu solicitați asistență specializată, să coordonați martorii"],a:[2],e:"Celelalte variante conțin câte o greșeală: pacientul se evaluează și se reevaluează, se mobilizează doar când e necesar, iar asistența specializată se cere ori de câte ori e nevoie.",r:"1.2"},
{m:1,q:"Transportul PROMPT al unui pacient la spital se face atunci când:",o:["pacientul se simte bine și este conștient","starea e bună, dar drumurile sunt desfundate","starea pacientului e destul de gravă și trebuie transportat la unitatea adecvată într-un timp scurt","starea pacientului este gravă și nu se poate stabiliza la locul intervenției"],a:[2],e:"Atenție la diferență: <b>prompt</b> = destul de grav, trebuie ajuns repede; <b>rapid</b> = foarte grav, nu poate fi stabilizat la fața locului (varianta d); <b>simplu</b> = viteza nu e factor hotărâtor.",r:"1.1 Comunicații"},
{m:1,q:"Pentru ca un SMU să funcționeze eficient:",o:["membrii lucrează individual","în urgență nu există noțiunea de SMU","SMU trebuie să fie militarizat","toți cei implicați trebuie să înțeleagă rolul pe care îl au"],a:[3],e:"Manualul spune explicit: atât în cazurile de rutină cât și în cele complexe, toți cei implicați trebuie să își înțeleagă rolul, prin colaborare strânsă și planificare.",r:"1.1"},
{m:1,q:"Dacă la locul intervenției sosește un echipaj medical specializat avansat, conduita dumneavoastră este:",o:["implicarea dumneavoastră nu mai este necesară","vă strângeți materialele și plecați fără să anunțați","medicul preia intervenția, iar dumneavoastră vă subordonați acestuia","medicul se supune indicațiilor dumneavoastră"],a:[2],e:"Coordonatorul echipei medicale este medicul. Echipajul de prim ajutor rămâne și ajută: multe proceduri nu se pot face cu mai puțin de trei persoane.",r:"1.1 Comunicații; 1.2 Comunicarea cu profesioniști"},
{m:1,q:"Puteți încadra un echipaj de prim ajutor numai dacă:",o:["ați absolvit o școală postliceală sanitară de trei ani","sunteți asistent medical generalist","ați absolvit un curs de prim ajutor calificat în afara structurilor SMURD","ați absolvit un curs de prim ajutor calificat în cadrul structurilor SMURD/IGSU acreditate"],a:[3],e:"Paramedicii se formează în centrele de formare din structura IGSU (sau alte centre autorizate și acreditate ale instituțiilor care au echipaje de prim ajutor), după un program aprobat și acreditat.",r:"1.3"},
{m:1,q:"113 reprezintă:",o:["număr apelabil de paramedici în conflict cu aparținătorii","numărul unic de urgență pentru persoanele cu deficiențe de auz și/sau vorbire (SMS)","număr apelabil doar din rețele fixe","număr pentru accidente CBRN"],a:[1],e:"Din 2015, 113 este numărul unic pentru mesajele (SMS) asociate apelurilor de urgență, destinat persoanelor cu deficiențe de auz și/sau vorbire.",r:"1.1 Acces"},
{q:"Care este timpul maxim de sosire al echipajelor de prim ajutor calificat în mediul URBAN?",o:["5 minute, în 100% din cazuri","8 minute, în cel puțin 90% din cazuri","12 minute, în cel puțin 75% din cazuri","15 minute, în cel puțin 90% din cazuri"],a:[1],e:"8 minute în urban (90% din cazuri) și 12 minute în rural (75% din cazuri). Cifrele de 15/20 de minute sunt pentru echipajele medicale de urgență sau terapie intensivă.",r:"1.1 Primul ajutor"},
{q:"Care este timpul maxim de sosire al echipajelor de prim ajutor calificat în mediul RURAL?",o:["8 minute, în 90% din cazuri","10 minute, în 80% din cazuri","12 minute, în cel puțin 75% din cazuri","20 de minute, în cel puțin 75% din cazuri"],a:[2],e:"Rural: 12 minute la cel puțin 75% din cazuri. 20 de minute e limita pentru echipajele medicale (cu medic/asistent) în rural.",r:"1.1"},
{q:"Cum este alcătuit echipajul de prim ajutor (EPA) cu ambulanță B2?",o:["1 medic, 1 asistent, 1 șofer","3 pompieri paramedici: comandant, servant, conducător auto","2 paramedici, fără șofer dedicat","1 asistent și 1 ambulanțier"],a:[1],e:"Paramedic 1 = comandant de echipaj, paramedic 2 = servant, paramedic 3 = conducător auto. Varianta „1 asistent + 1 ambulanțier” descrie un EMU-A.",r:"1.2"},
{q:"Cine folosește stația radio TETRA a ambulanței și o ține permanent pe recepție?",o:["comandantul de echipaj","servantul","paramedicul conducător auto","medicul coordonator"],a:[2],e:"Stația TETRA mobilă e utilizată de paramedicul conducător auto. Convorbirile particulare sunt interzise; telefonul mobil se folosește doar unde TETRA nu are acoperire.",r:"1.2 Comunicarea cu dispeceratul"},
{q:"Ce înseamnă ANI și ALI în sistemul 112?",o:["identificarea automată a numărului, respectiv a locației apelantului","alarmare națională, respectiv alarmare locală","ambulanță neasistată, respectiv ambulanță asistată","localizarea automată a vehiculelor de intervenție"],a:[0],e:"ANI (Automatic Number Identification) afișează numărul de la care se sună, ALI (Automatic Location Identification) afișează adresa/locul apelului. Localizarea vehiculelor se face prin AVL.",r:"1.1 Acces"},
{q:"Defibrilarea în primele 3–5 minute de la instalarea stopului, împreună cu RCP, crește șansele de supraviețuire cu:",o:["5–10%","20–30%","50–70%","peste 90%"],a:[2],e:"De aceea s-au instalat defibrilatoare în locuri publice și se instruiește populația să le folosească.",r:"1.1 Defibrilare precoce"},
{q:"Pacientul este găsit în stop cardio-respirator. Ce face echipajul de prim ajutor? (alege toate variantele corecte)",o:["începe manevrele de resuscitare","ia obligatoriu legătura cu coordonatorul medical pentru trimiterea unui echipaj cu medic","constată decesul și lasă familiei scrisoarea medicală","așteaptă echipajul cu medic înainte de a începe RCP"],a:[0,1],e:"EPA începe RCP și cere obligatoriu echipaj cu medic. Numai medicul poate constata decesul și lăsa aparținătorilor scrisoarea medicală.",r:"1.2 Fișa prespitalicească"},
{q:"Coordonarea medicală asigurată de un medic aflat în legătură radio/telefonică permanentă cu echipajul din teren se numește:",o:["indirectă (off-line)","directă (on-line)","on-scene","administrativă"],a:[1],e:"Off-line = protocoale, instruire, management. On-line = medic în legătură directă cu echipajul. On-scene = medicul coordonator se deplasează la incident (victime multiple).",r:"1.1"},
{q:"Care este prima lecție pe care trebuie să o învețe un salvator, potrivit manualului?",o:["să ajungă cât mai repede","să știe ce NU trebuie să facă","să transporte orice pacient","să completeze fișa"],a:[1],e:"Manualul subliniază: „Prima lecție care trebuie învățată ca salvator este: SĂ ȘTII CE NU TREBUIE SĂ FACI.”",r:"1.2"},
{q:"Cursul inițial de prim ajutor calificat pentru pompieri durează și se promovează cu:",o:["2 săptămâni, nota 5","4 săptămâni (160 de ore), media minim 7","3 luni, media minim 8","6 luni, admis/respins"],a:[1],e:"Etapa I: 4 săptămâni, 160 de ore, media finală minim 7. Etapa a II-a (consolidare și noi competențe): 3 săptămâni, 120 de ore, cu cel puțin 50 de abordări venoase pe simulator și pacient.",r:"1.3"}
],

CHAPTERS.push({
id:13, title:"Pacienți cu nevoi speciale", pages:"357–377",
keypoints:[
"Relația terapeutică: empatie (înțelegi „ca și cum ai fi în locul lui”, fără să te identifici), acceptare necondiționată și comunicare adaptată.",
"Comunicarea are trei componente: verbală (cuvinte clare, fără termeni de specialitate), nonverbală (mimică, gesturi, postură, contact vizual) și paraverbală (ton, volum, ritm).",
"Pacientul cu dizabilitate fizică nu e neputincios: luați anamneza direct de la el; dacă e în scaun cu rotile, așezați-vă la nivelul ochilor lui.",
"Retard mental: IQ sub 70, debut înainte de maturitate. Unii au prag crescut la durere (circa 25%) și pot ascunde probleme grave. Persoanele cu autism pot fi defensive la atingere.",
"Prezența unei persoane cunoscute e obligatorie la evaluarea și transportul pacientului cu retard mental.",
"Vârstnicul: semnele vitale normale nu exclud leziuni grave (rezervă fiziologică redusă); se poate deteriora rapid. Căutați cauza căderii (sincopă, AVC, medicație). Notați medicația.",
"Căile aeriene la vârstnic: proteze dentare, artroză cervicală sau temporo-mandibulară pot îngreuna manevrele.",
"Demența: schimbarea mediului accentuează confuzia; personalul tinde să subestimeze maltratarea și neglijarea acestor pacienți.",
"Formele abuzului: fizic, sexual, emoțional/psihologic, economic/financiar, neglijare, abandon.",
"Violența în familie: siguranța salvatorului (cereți poliția), întrebați despre violență doar în absența partenerului, nu judecați, nu întrebați „de ce?”, notați exact leziunile în fișă.",
"Abuzul asupra copilului: discrepanță între poveste și leziuni, leziuni în stadii diferite de vindecare, arsuri „în mănușă/șosetă”, arsuri rotunde de țigară. Credeți copilul, nu sugerați răspunsuri, păstrați hainele ca probe, anunțați poliția."
],
questions:[

{m:1,q:"Componentele comunicării sunt:",o:["verbală","paraverbală","nonverbală","toate variantele de mai sus"],a:[3],e:"Componenta nonverbală e cea mai greu de controlat; mesajele verbale și nonverbale pot fi contradictorii.",r:"13 Introducere"},
{m:1,q:"Simptome ale sclerozei multiple:",o:["oboseală extremă","pierderea vederii sau vedere dublă","febră peste 39 °C","rinoree"],a:[0,1],e:"Plus: amorțeli, slăbiciune la un membru, furnicături, instabilitate la mers, spasme, amețeli. Boala nu e contagioasă; pacientul nu se izolează.",r:"13.3"},
{m:1,q:"Formele abuzului sunt:",o:["fizic","emoțional","prin neglijare","sexual"],a:[0,1,2,3],e:"Plus financiar/economic, abandon, neglijarea de sine (la vârstnici).",r:"13.5–13.8; Tabel 13.4"},
{m:1,q:"Semne ale abuzului emoțional care însoțesc abuzul fizic:",o:["depresie, anxietate, frică","somnolență, poftă de mâncare crescută","nervozitate, evitarea altor persoane, neîncredere","sociabilitate crescută, încredere în sine"],a:[0,2],e:"Plus: stimă de sine scăzută, agresivitate, instabilitate emoțională, insomnie, vinovăție și rușine.",r:"13.6"},
{q:"Ce înseamnă empatia în relația cu pacientul?",o:["să plângi împreună cu pacientul","să înțelegi ce comunică pacientul ca și cum ai fi în locul lui, fără să te identifici cu el, și să-i recomunici asta","să fii de acord cu tot ce spune","să-i dai sfaturi personale"],a:[1],e:"Ex.: „Din ce mi-ați spus, înțeleg că...”. Acceptarea necondiționată înseamnă acceptarea persoanei, nu a tot ce face.",r:"13 Introducere"},
{q:"Pacient în scaun cu rotile, cu o problemă medicală acută. Cum obțineți anamneza?",o:["întreb doar însoțitorul","îl întreb direct pe pacient, așezat la nivelul ochilor lui; apelez la însoțitor doar dacă pacientul nu poate răspunde","nu pun întrebări","vorbesc mai tare și mai rar, ca la un copil"],a:[1],e:"O persoană cu dizabilitate fizică nu e neputincioasă. Pacientul cu disfazie/dizartrie are nevoie de mai mult timp.",r:"13.1"},
{q:"De ce poate fi înșelătoare evaluarea durerii la unii pacienți cu retard mental?",o:["exagerează mereu","circa 25% au un prag crescut la durere și reacționează puțin chiar la afecțiuni grave","nu simt nimic niciodată","durerea nu contează"],a:[1],e:"Insensibilitatea la durere poate ascunde probleme medicale grave. Căutați schimbări ale comportamentului obișnuit.",r:"13.2"},

{q:"Ce întrebări sunt de preferat la un pacient cu retard mental care poate vorbi?",o:["întrebări deschise, simple","doar întrebări cu da/nu","întrebări complicate despre cauze și timp","nicio întrebare"],a:[0],e:"Mulți au dificultăți cu conceptele de timp și cauzalitate; pacienții nonverbali pot arăta cu mâna.",r:"13.2"},
{q:"Vârstnică de 82 de ani, căzută acasă, cu fractură de antebraț, semne vitale normale. Ce e important? (alege toate)",o:["căutați cauza căderii (sincopă, aritmie, AVC, medicație)","nu vă liniștiți din cauza semnelor vitale normale: vârstnicii se pot deteriora rapid","notați medicația folosită","ajunge imobilizarea brațului, restul nu contează"],a:[0,1,2],e:"Căderile la vârstnici au rareori o singură cauză.",r:"13.4"},
{q:"Ce particularități pot îngreuna managementul căilor aeriene la vârstnic?",o:["protezele dentare, artroza cervicală, artroza temporo-mandibulară","părul alb","ochelarii","înălțimea"],a:[0],e:"Artroza cervicală limitează extensia gâtului; cea temporo-mandibulară limitează deschiderea gurii.",r:"13.4"},
{q:"Pacient cu demență, agitat la sosirea echipajului. Ce trebuie știut?",o:["schimbarea mediului îi accentuează confuzia; abordați calm, blând; atenție la posibila neglijare sau maltratare din partea îngrijitorilor","e o cauză pierdută","se tratează ca orice pacient psihiatric periculos","nu are nevoie de evaluare"],a:[0],e:"Manualul subliniază: nu vedeți demența ca pe o cauză pierdută, ci ca pe o viață de om care contează.",r:"13.3 Demența"},
{q:"Atac de panică în timpul unui incendiu (proprietarul casei). Ce simptome poate avea?",o:["palpitații, hiperventilație, dispnee, durere toracică, amețeli, furnicături, teamă de moarte","doar somnolență","febră mare","nimic vizibil"],a:[0],e:"Multe simptome se suprapun cu afecțiuni medicale reale, așa că pacientul trebuie evaluat complet.",r:"13.3"},
{q:"Femeie cu echimoze multiple, în stadii diferite de vindecare, partenerul răspunde în locul ei și nu vrea să iasă din cameră. Ce faceți? (alege toate)",o:["mă asigur că a fost anunțată poliția (siguranța echipajului)","o întreb despre violență doar când partenerul nu e de față","o confrunt pe loc pe partener","notez exact în fișă leziunile și comportamentele observate"],a:[0,1,3],e:"Abuzatorul își poate îndrepta violența asupra echipajului. Fișa poate deveni probă într-un proces.",r:"13.6"},
{q:"Ce întrebări EVITAȚI când vorbiți cu o victimă a violenței în familie?",o:["„Vi s-a întâmplat asta și dumneavoastră?”","întrebări care încep cu „de ce?” sau care sugerează că ea e vinovată","„Ce pot face pentru dumneavoastră?”","„Nu este vina dumneavoastră.”"],a:[1],e:"Exprimați grijă fără judecată, subliniați că violența nu e acceptabilă și că sentimentele ei sunt normale.",r:"13.6"},
{q:"Leziuni care sugerează abuz asupra copilului (alege toate):",o:["arsuri clar delimitate „în mănușă” sau „în șosetă” (imersie în apă fierbinte)","arsuri mici, rotunde, cu crustă (țigară)","echimoze multiple pe fese, coapse, obraji, urechi, gât, în stadii diferite","o singură julitură la genunchi după o cădere de pe bicicletă"],a:[0,1,2],e:"Atenție la discrepanța dintre explicația părintelui și leziune (de ex. fractură de femur la sugar „căzut din pat”).",r:"13.7"},
{q:"Un copil vă spune că a fost abuzat. Ce faceți? (alege toate)",o:["îl credeți","nu sugerați răspunsuri („te-a bătut tata?”)","păstrați hainele ca probe dacă abuzul e recent și anunțați poliția","îl spălați și îl schimbați imediat"],a:[0,1,2],e:"Nu dezbrăcați și nu spălați copilul decât dacă e absolut necesar. Nu vă arătați furia sau indignarea în fața lui.",r:"13.7 (Atenție)"},
{q:"Semne că un vârstnic poate fi abuzat de îngrijitor:",o:["pare să se teamă de însoțitor; relatările se contrazic; îngrijitorul e indiferent sau furios și nu-l lasă singur cu echipajul","vârstnicul e vesel și vorbăreț","îngrijitorul e calm și cooperant","casa e curată"],a:[0],e:"Vârstnicul poate nega abuzul din rușine sau teamă de abandon. Raportați medicului de gardă, ca să fie informată asistența socială.",r:"13.8"},

CHAPTERS.push({
id:15, title:"Incidente cu victime multiple", pages:"402–411",
keypoints:[
"Incident cu victime multiple: un eveniment izolat, într-o zonă limitată, cu un număr relativ mare de victime, care poate fi rezolvat cu resursele din zonă.",
"Chiar și la cele mai bune servicii trec minim 30–45 de minute până ajung primele victime la spital, deci „ora de aur” se consumă în prespital.",
"Siguranța înainte de orice: un salvator rănit nu mai ajută pe nimeni și devine încă o victimă. Urmăriți traficul, curentul, focul, materialele periculoase (HazMat), obiectele instabile sau ascuțite, animalele, vremea și mulțimea.",
"Succesiunea corectă: evaluarea riscurilor → recunoaștere → triaj → tratament → evacuare.",
"Primul echipaj NU tratează victime la început: confirmă evenimentul la dispecerat, evaluează riscurile, face recunoașterea medicală, raportează și inițiază dispozitivul medical (punctul de regrupare / PMA) până sosește DSM.",
"DSM (Directorul de Salvare Medicală) coordonează toată activitatea medicală și se subordonează Comandantului Operațiunilor de Salvare (COS).",
"Echipa din teren (veste/banderole roșii) localizează, extrage și transportă victimele la PMA. Medicul de teren face doar manevre minimale și nu întârzie evacuarea.",
"PMA (Postul Medical Avansat): victimele sunt grupate, triate, tratate inițial și pregătite pentru evacuare; are zone pentru urgențe absolute și urgențe relative.",
"Triajul START: merge singur → VERDE; nu respiră nici după deschiderea căii aeriene → NEGRU (decedat); respirații > 30/min, reumplere capilară > 2 s (sau fără puls radial), nu execută comenzi simple → ROȘU; restul → GALBEN.",
"Decedații din teren NU se aduc la PMA: rămân pe loc, acoperiți, pentru ancheta medico-legală. Decesul îl constată medicul; paramedicii doar la leziuni evident incompatibile cu viața."
],
questions:[
{m:1,q:"NU reprezintă o atribuție a primei echipe medicale care ajunge la locul intervenției:",o:["evaluarea riscurilor și recunoașterea medicală","informarea dispeceratului","acordarea de ajutor medical victimelor","inițierea instalării dispozitivului medical"],a:[2],e:"Primul echipaj nu acordă asistență medicală în prima parte a intervenției. Rolul lui e să organizeze: riscuri, recunoaștere, raport, inițierea PMA.",r:"15.2 Rolul primei echipe"},
{m:1,q:"Asistența medicală în timpul descarcerării are drept scop:",o:["asigurarea patenței căilor aeriene","analgezia și sedarea","abordul venos și reumplerea volemică","toate de mai sus"],a:[3],e:"Descarcerarea poate dura mult, iar victima are nevoie de îngrijire pe tot parcursul. Echipa medicală trebuie să cunoască procedurile pompierilor.",r:"15.3"},
{m:1,q:"Triajul START clasifică victimele astfel:",o:["reumplere capilară peste 2 s: cod galben","respirații 10–30/min: cod roșu","victimele care se pot deplasa: cod verde","absența respirației după deschiderea căii aeriene: cod roșu"],a:[2],e:"Reumplerea > 2 s înseamnă roșu, nu galben. Respirațiile între 10 și 30 nu decid singure codul roșu. Cine nu respiră nici după deschiderea căii aeriene e negru (decedat).",r:"15.2 Protocolul START"},
{m:1,q:"Despre PMA sunt adevărate următoarele, cu EXCEPȚIA:",o:["este primul punct de concentrare a efortului medical","personalul care îl încadrează poartă însemne de culoare roșie","victimele sunt reevaluate după tratament, pentru prioritățile de evacuare","are două zone de tratament: urgențe relative și urgențe absolute"],a:[1],e:"Vestele/banderolele roșii identifică echipa din teren (colectarea victimelor), nu personalul PMA.",r:"15.2"},
{m:1,q:"Succesiunea corectă a etapelor intervenției medicale este:",o:["recunoaștere, evaluarea riscurilor, triaj, tratament, evacuare","evaluarea riscurilor, recunoaștere, tratament, triaj, evacuare","recunoaștere, evaluarea riscurilor, tratament, triaj, evacuare","evaluarea riscurilor, recunoaștere, triaj, tratament, evacuare"],a:[3],e:"Întâi siguranța, apoi recunoașterea, apoi triajul (ca să știm pe cine tratăm întâi), tratamentul și evacuarea.",r:"15.2"},
{q:"Ce definește un incident cu victime multiple (spre deosebire de dezastru)?",o:["un eveniment izolat, într-o zonă limitată, cu multe victime, rezolvabil cu resursele locale","orice accident cu 2 victime","un eveniment care depășește resursele țării","doar accidentele feroviare"],a:[0],e:"",r:"15 Introducere"},
{q:"Cât timp trece, minim, până ajung primele victime la spital într-un accident colectiv, chiar la serviciile cele mai eficiente?",o:["5 minute","30–45 de minute","2 ore","24 de ore"],a:[1],e:"De aceea „ora de aur” se consumă în prespital, iar organizarea pe teren contează enorm. Până la 1/3 din decesele în accidentele rutiere ar putea fi prevenite.",r:"15 Introducere"},
{q:"Ce informații ar trebui să obțină dispecerul la apelul inițial? (alege toate)",o:["locul și amploarea (tipul și numărul vehiculelor)","numărul estimativ și starea victimelor","dacă e nevoie de descarcerare, pompieri, jandarmi, firme de gaze/curent","factori de risc: cisterne cu materiale periculoase, linii electrice"],a:[0,1,2,3],e:"Condițiile de mediu (iarnă, vară, ploaie, noapte, ceață) afectează și victimele, și salvatorii.",r:"15.1"},
{q:"Ambulanța ajunge prima, iar descarcerarea va întârzia. Unde parcați?",o:["cât mai aproape de accident, cu fața spre direcția de evacuare","departe, pe contrasens","în mijlocul scenei, cu ușile deschise","nu contează"],a:[0],e:"Dacă descarcerarea ajunge odată cu voi, ea parchează lângă accident, iar ambulanța cât mai aproape, tot orientată spre evacuare. Lăsați loc și pentru alte vehicule.",r:"15.1 Amplasarea vehiculelor"},
{q:"Ce riscuri evaluați la sosire, înainte de orice altceva? (alege toate)",o:["traficul și curentul electric","focul și materialele periculoase (HazMat)","obiectele instabile sau ascuțite, animalele","condițiile de mediu și mulțimea de privitori"],a:[0,1,2,3],e:"Oprirea traficului e adesea prima măsură; cereți sprijinul poliției sau jandarmeriei.",r:"15.2"},
{q:"Suspectați materiale periculoase (cisternă). Ce faceți?",o:["intru repede să văd ce e","caut plăcuța de identificare, cer opinia experților și intru în zonă doar cu echipamentul de protecție indicat de ei","spăl totul cu apă","ignor, prioritatea sunt victimele"],a:[1],e:"Recunoașterea în zone cu materiale periculoase o fac echipe cu echipament special de protecție.",r:"15.2 HazMat"},
{q:"Cine coordonează întreaga activitate medicală la un accident colectiv?",o:["primul paramedic sosit, până la final","Directorul de Salvare Medicală (DSM), subordonat Comandantului Operațiunilor de Salvare (COS)","polițistul","șoferul ambulanței"],a:[1],e:"DSM e medicul șef SMURD sau locțiitorul lui (în lipsa SMURD, managerul serviciului de ambulanță județean) și lucrează din Punctul de Comandă.",r:"15.2"},
{q:"Ce face echipa din teren (veste roșii)?",o:["tratează definitiv victimele pe loc","localizează victimele, le extrage (inclusiv prin descarcerare) și le transportă cât mai repede la PMA, întâi pe cele care au nevoie de îngrijire imediată","se ocupă de presă","face evacuarea spre spitale"],a:[1],e:"E condusă de un ofițer (de preferință pompier) și poate include pompieri, brancardieri, voluntari și medicul de teren.",r:"15.2"},
{q:"Ce face medicul de teren?",o:["intervenții lungi pe loc, pentru fiecare victimă","stabilește prioritățile de evacuare spre PMA, face doar manevre minimale fără să întârzie evacuarea, atribuie fișe de triaj","conduce traficul","stă la PMA"],a:[1],e:"Trebuie să fie un medic cu experiență și cu mult sânge rece.",r:"15.2"},
{q:"Ce se întâmplă în PMA (Postul Medical Avansat)?",o:["victimele sunt grupate, triate, tratate inițial și pregătite pentru evacuare","se fac operații complexe","se țin decedații","doar se înregistrează numele"],a:[0],e:"Structura: medic șef PMA, echipe pentru urgențe absolute și relative, ofițer de evacuare, ofițer de logistică.",r:"15.2"},
{q:"De ce folosim un protocol de triaj (START)?",o:["ca să facem maximum posibil pentru un număr cât mai mare de victime cu resurse limitate","ca să tratăm întâi pe cel care strigă","ca să punem diagnostice exacte","pentru statistici"],a:[0],e:"Un protocol bun de triaj e simplu, ușor de învățat, nu cere abilități deosebite și nu se bazează pe diagnostice exacte.",r:"15.2 START"},
{q:"START: victima nu respiră. Deschideți calea aeriană și începe să respire. Cod?",o:["ROȘU","NEGRU","GALBEN","VERDE"],a:[0],e:"Dacă nu respiră nici după deschiderea căii aeriene, codul e negru.",r:"15.2 START"},
{q:"START: victima nu poate merge, respiră 24/min, are puls radial (reumplere < 2 s) și execută comenzi simple. Cod?",o:["ROȘU","GALBEN","VERDE","NEGRU"],a:[1],e:"Nu îndeplinește niciun criteriu de roșu, dar nu poate merge, deci e urgență relativă.",r:"15.2 START"},
{q:"START: victima respiră 36/min. Cod?",o:["GALBEN","ROȘU","VERDE","NEGRU"],a:[1],e:"Respirațiile > 30/min înseamnă imediat ROȘU (urgență absolută); nu mai evaluați restul.",r:"15.2 START"},
{q:"Ce faceți cu victimele decedate în teren?",o:["le aducem la PMA","le lăsăm în poziția găsită, lângă obiectele lor personale, acoperite; apoi sunt adunate într-o morgă provizorie, ferită privirilor","le transportăm la spital primele","le mutăm pe marginea drumului, neacoperite"],a:[1],e:"Decesul îl constată medicul. Paramedicii pot declara decesul doar la leziuni evident incompatibile cu viața.",r:"15.3"}
],
cases:[
{title:"Microbuz răsturnat pe DN",intro:"Sunteți primul echipaj (3 paramedici) la un microbuz răsturnat în șanț. Vedeți mai multe persoane: unele merg pe marginea drumului, altele sunt în vehicul. Traficul nu e oprit. E seară și plouă.",vitals:["~14 victime estimate","Trafic activ","Întuneric, ploaie"],
steps:[
{q:"Ce faceți primul?",o:[
{t:"Parcăm ca să protejăm zona, pornim luminile de avertizare, evaluăm riscurile (trafic, combustibil, stabilitatea vehiculului) și cerem poliția pentru oprirea traficului",ok:1,f:"Corect. Siguranța e prima etapă."},
{t:"Fugim la prima victimă care strigă și o tratăm",ok:0,f:"Primul echipaj nu tratează victime la început. Dacă se blochează pe o victimă, toată intervenția rămâne fără organizare."}]},
{q:"Ce transmiteți la dispecerat?",o:[
{t:"Confirmăm evenimentul neobișnuit: tipul și numărul vehiculelor, numărul estimat de victime, încarcerați, riscuri, căile de acces și sprijinul necesar (descarcerare, alte ambulanțe, SMURD)",ok:1,f:"Corect. E raportul de informare după recunoașterea medicală."},
{t:"„Avem un accident, veniți”",ok:0,f:"Prea puțin. Dispeceratul trebuie să poată anticipa resursele."}]},
{q:"Începeți triajul START. Cum separați rapid victimele care merg?",o:[
{t:"Le cer celor care pot merge să vină într-un punct indicat, lângă ambulanță: sunt COD VERDE și vor fi reevaluate ulterior",ok:1,f:"Corect. Cei verzi pot fi reevaluați mai târziu (unii se pot agrava)."},
{t:"Îi examinez pe fiecare pe rând, complet",ok:0,f:"Evaluarea completă vine după triaj, în PMA."}]},
{v:["Victimă în vehicul","Nu respiră"],q:"O victimă din vehicul nu respiră. Ce faceți?",o:[
{t:"Deschid calea aeriană. Dacă respiră: ROȘU. Dacă nu: NEGRU, și trec mai departe",ok:1,f:"Corect. La triaj nu se face RCP: resursele merg spre cei care pot fi salvați."},
{t:"Încep RCP pe loc și nu mă opresc",ok:0,f:"Într-un incident cu victime multiple, RCP pe o victimă fără respirație ar consuma resurse care ar salva mai multe vieți."}]},
{q:"Sosesc alte echipaje. Ce le spuneți?",o:[
{t:"Le atribui sarcini: amenajarea punctului de regrupare/PMA, echipa din teren pentru extragere, tratamentul roșiilor; când sosește DSM, îi predau coordonarea",ok:1,f:"Corect. Primul echipaj inițiază dispozitivul medical până la sosirea DSM."},
{t:"Fiecare echipaj ia o victimă și pleacă la spital",ok:0,f:"Evacuările dezorganizate trimit victime ușoare primele și suprasolicită un singur spital."}]}
],

CHAPTERS.push({
id:16, title:"Descarcerare și salvări în situații speciale", pages:"412–426",
keypoints:[
"Descarcerarea: identificarea persoanelor blocate, accesul la ele și degajarea lor fără a le agrava leziunile, cu asistență medicală când e nevoie. Primul pas este întotdeauna siguranța salvatorilor.",
"Echipament de protecție: cască, ochelari/ecran, mănuși, costum de protecție (ideal ignifug, cu benzi reflectorizante), bocanci și mască filtrantă la substanțe periculoase.",
"Asigurarea zonei: semnalizare (balizare) la ambele capete, parcare care protejează zona, spectatorii ținuți la distanță; controlul traficului revine poliției.",
"Combustibil scurs: chemați pompierii; până atunci acoperiți-l cu praf sau pământ. Opriți contactul. Bateria se deconectează (întâi borna negativă), dar airbagurile nedeclanșate rămân periculoase chiar și fără baterie.",
"Cablu electric căzut peste mașină: victima rămâne în vehicul, chemați pompierii și compania de electricitate, privitorii stau la cel puțin 50 m. Nu atingeți și nu mutați cablurile.",
"Vehiculul se stabilizează ÎNTOTDEAUNA, chiar și pe 4 roți (pene la roți, cale). Pe un vehicul răsturnat lateral nu urcați niciodată.",
"Acces: încercați întâi TOATE portierele (în 85–90% din cazuri accesul se face pe o portieră sau un geam). Apoi geamul lateral sau luneta (securit) cel mai îndepărtat de victimă, spart cu cuiul percutor într-un colț. Nu intrați prin parbriz (e duplex).",
"Incendiu: stingător cu praf, jetul la baza flăcărilor; neimplicații stau la cel puțin 30 m. Aburul de la radiator se risipește în ~1 m, fumul nu.",
"Extracție de urgență (fără unelte): doar dacă mașina arde sau victima e în stop cardio-respirator. Altfel se folosesc vesta extractoare (KED, minim 3 salvatori) și bordul, cu coloana în ax.",
"Salvarea din apă: întindeți sau aruncați un obiect, nu intrați dacă nu sunteți antrenați. Victima inconștientă din apă se tratează ca leziune de coloană. Pe gheață vă deplasați culcat, legat cu o frânghie. În spații închise nu intrați fără aparat de respirat."
],
questions:[
{m:1,q:"Primul pas în procesul de descarcerare este:",o:["extragerea victimelor","siguranța salvatorilor","îngrijirea pacientului","transportul pacientului"],a:[1],e:"Siguranța salvatorului și a pacientului sunt esențiale. Un salvator rănit devine încă o victimă.",r:"16.1"},
{m:1,q:"Când ajungeți la locul accidentului:",o:["opriți luminile de avertizare","nu pierdeți timpul așteptând ca scena să fie marcată și protejată","parcați autosanitara după accident","parcați autosanitara înainte de accident"],a:[3],e:"Parcat înainte de accident (în sensul de mers), vehiculul protejează zona de traficul care vine din spate. Luminile de avertizare rămân pornite.",r:"16.1 Asigurarea zonei"},
{m:1,q:"Controlul traficului la accident este responsabilitatea:",o:["pompierilor","poliției","paramedicilor","medicului"],a:[1],e:"Semnalizarea zonei se face de regulă împreună cu poliția.",r:"16.1"},
{m:1,q:"La locul scenei vă uitați după toate, cu EXCEPȚIA:",o:["mecanismul accidentului","scurgerile de lichide","pacienții încarcerați sau aruncați din vehicul","cantitatea de aer rămasă în pneuri"],a:[3],e:"Pneurile pot fi dezumflate pentru stabilizare, dar presiunea lor nu face parte din evaluarea scenei.",r:"16.1"},
{m:1,q:"În timpul descarcerării ar trebui să comunicați cu:",o:["poliția","presa","echipa de salvare","compania de asigurări"],a:[2],e:"Echipa medicală trebuie să cunoască procedurile pompierilor și să fie coordonată cu ei.",r:"16.1"},
{m:1,q:"Există cabluri electrice căzute lângă vehiculul accidentat. Ce faceți?",o:["mutați singuri cablurile de lângă mașină","atingeți cablurile cu un obiect, ca să vedeți dacă sunt sub tensiune","scoateți ușor pacientul pe lângă cabluri","pacientul rămâne în vehicul până sosesc cei care întrerup curentul"],a:[3],e:"Alertați pompierii și compania de electricitate. Privitorii stau la cel puțin 50 m.",r:"16.1"},
{m:1,q:"Înainte de a încerca accesul în vehicul, ar trebui deconectat(ă):",o:["radioul","bateria","hidraulicele","frâna"],a:[1],e:"Opriți contactul și deconectați bateria, întâi borna negativă. Airbagurile nedeclanșate rămân însă un risc.",r:"16.1"},
{m:1,q:"Scoateți dintr-un vehicul un pacient care are nevoie de RCP. Ce tehnică folosiți?",o:["extracția de urgență","vesta extractoare (KED)"],a:[0],e:"KED-ul e pentru pacienții cu semne vitale stabile, când e timp de pregătire.",r:"16.1 Mobilizarea victimei"},
{m:1,q:"Nu încercați să intrați într-un vehicul până când acesta nu este:",o:["stabilizat","spălat","fotografiat","remorcat"],a:[0],e:"Stabilizarea e obligatorie chiar și pentru un vehicul pe 4 roți.",r:"16.1"},
{m:1,q:"Salvarea din peșteri sau spații închise e considerată:",o:["situație specială, care cere echipe antrenate","o intervenție de rutină","o sarcină pentru oricine e în zonă","nu e treaba SMURD"],a:[0],e:"Alertați imediat echipele specializate și nu intrați până nu sosesc.",r:"16.2"},
{q:"De ce poartă salvatorii cască la descarcerare?",o:["din regulament, fără motiv practic","protejează împotriva traumelor craniene și a muchiilor ascuțite rezultate din tăiere","pentru identificare","pentru lanternă"],a:[1],e:"Se adaugă ochelarii, mănușile, costumul ignifug reflectorizant și bocancii.",r:"16.1"},
{q:"Benzină scursă pe carosabil, pompierii nu au sosit. Ce faceți?",o:["o spăl cu apă din ambulanță","o acopăr cu praf sau pământ, ca să scadă evaporarea și riscul de incendiu; opresc contactul mașinii","nimic","aprind lumini de avertizare cu flacără lângă ea"],a:[1],e:"",r:"16.1"},
{q:"Ați deconectat bateria. Mai există risc de declanșare a airbagurilor?",o:["nu, fără baterie nu se mai pot declanșa","da, multe airbaguri au declanșare pirotehnică independentă de baterie, iar unele circuite păstrează curent","doar la mașinile vechi","doar la airbagurile laterale"],a:[1],e:"Identificați tipul, poziția și numărul airbagurilor, mai ales al celor tip cortină din stâlpi, unde se taie de obicei.",r:"16.1"},
{q:"Mașina e pe toate cele 4 roți și pare stabilă. Trebuie stabilizată?",o:["nu","da, întotdeauna: pene de o parte și de alta la roți, cale în trepte, eventual dezumflarea roților","doar dacă e pe pantă","doar noaptea"],a:[1],e:"Orice mișcare a vehiculului poate agrava leziunile victimelor sau răni salvatorii.",r:"16.1 Stabilizarea vehiculului"},
{q:"Vehicul răsturnat pe o parte, cu victima înăuntru. Cum procedați? (alege toate)",o:["stabilizarea o fac pompierii, cu echipament special","nu urc niciodată pe vehicul","dacă trebuie neapărat să intru, scot luneta cu grijă și înaintez cât mai lipit de sol","urc pe portiera de sus, e mai rapid"],a:[0,1,2],e:"Un vehicul răsturnat lateral e deosebit de instabil.",r:"16.1"},
{q:"Portierele par blocate. Ce încercați întâi?",o:["deschid cu echipament hidraulic portiera din dreptul victimei","încerc TOATE portierele, chiar și pe cele deteriorate, din interior și exterior simultan; în 85–90% din cazuri accesul se face pe o portieră sau un geam","sparg parbrizul","aștept"],a:[1],e:"E o risipă de timp să forțați o portieră cu echipament când alta se deschide ușor.",r:"16.1 Accesul la victime"},
{q:"Pe unde intrați în mașină dacă portierele nu se deschid?",o:["prin parbriz","prin geamul lateral sau lunetă (securit), cel mai îndepărtat de victimă, spart cu cuiul percutor într-un colț, cu victima acoperită","prin acoperiș, tăiat cu toporul","prin portbagaj, mereu"],a:[1],e:"Parbrizul e duplex (cu folie de plastic) și nu se sparge ușor. Resturile de geam se scot spre exterior.",r:"16.1 Accesul pe geam"},
{q:"Mașina arde. Cum folosiți stingătorul cu praf?",o:["jetul în habitaclu, peste pasageri","verific manometrul, furtunul, scot siguranța și pulverizez la baza flăcărilor, nu spre pasageri","arunc apă","stau la 30 m și privesc"],a:[1],e:"Pulberea nu e toxică pentru pasageri, dacă îi atinge. Persoanele neimplicate stau la cel puțin 30 m.",r:"16.1 Incendiile"},
{q:"Iese „fum” alb de sub capotă, dar se risipește în ~1 m. Ce e, probabil?",o:["incendiu la motor","vapori de apă de la radiatorul spart","gaz toxic","fum de la frâne"],a:[1],e:"Fumul de incendiu nu se risipește atât de repede.",r:"16.1"},
{q:"Când e indicată extracția de urgență, fără unelte?",o:["oricând grăbim","când mașina e în flăcări sau victima e în stop cardio-respirator","când pacientul cere","pentru victimele cu fracturi"],a:[1],e:"În rest, victima se imobilizează (KED, bord) și se scoate cu coloana în ax.",r:"16.1 Mobilizarea victimei"},
{q:"Vesta extractoare KED: ce e adevărat? (alege toate)",o:["se folosește la victime cu semne vitale stabile, când e timp de pregătire","are 3 centuri toracice colorate (verde, galben, roșu), 2 pentru cap și 2 pentru bazin","e nevoie de minim 3 salvatori","nu se poate folosi la gravide sau copii"],a:[0,1,2],e:"KED-ul poate fi folosit și la gravide și copii și permite aplicarea monitorului sau a defibrilatorului.",r:"16.1"},
{q:"De ce nu se implică fizic liderul echipei mixte în timpul extracției?",o:["din comoditate","ca să vadă toată scena și să coordoneze eficient","nu are voie prin lege","ca să stea de vorbă cu presa"],a:[1],e:"",r:"16.1 Evacuarea victimelor"},
{q:"Submersie vs. imersie:",o:["submersie: fața sub apă (asfixie și stop în câteva minute); imersie: capul deasupra apei (risc principal: hipotermia)","sunt sinonime","imersia e mai gravă întotdeauna","submersia înseamnă doar apă rece"],a:[0],e:"",r:"16.2 Salvarea din apă"},
{q:"O persoană se zbate în apă la 5 m de mal. Nu sunteți salvator antrenat. Ce faceți?",o:["sar imediat în apă","întind sau arunc ceva de care se poate prinde (prăjină, vâslă, colac, frânghie, recipient de plastic) și chem ajutor","îi strig să înoate","plec după ajutor fără să fac nimic"],a:[1],e:"Curenții pot duce departe atât victima, cât și salvatorul, iar atunci trebuie salvați amândoi.",r:"16.2"},
{q:"Victimă inconștientă scoasă din apă după o săritură. Ce aveți în vedere? (alege toate)",o:["o tratez ca pe o leziune de coloană (fără hiperextensia capului)","mă aștept la regurgitare (stomac plin cu apă)","dacă nu respiră, încep RCP cu oxigen pe mască și balon","o scutur cu capul în jos, ca să scot apa"],a:[0,1,2],e:"Victima se scoate din apă în poziție orizontală, pe un plan dur, și se mobilizează minim. Reîncălzirea începe concomitent.",r:"16.2"},
{q:"Un scafandru are după urcare amețeli, tulburări de vorbire și dureri articulare. Ce faceți?",o:["îl trimit acasă","ABC, oxigen cât mai repede, eventual decubit lateral stâng, transport la un spital cu cameră hiperbară","îl pun să se scufunde din nou","doar analgezice"],a:[1],e:"Embolia gazoasă și boala de decompresiune pot semăna cu un AVC.",r:"16.2 Scufundarea"},
{q:"Salvarea unei persoane căzute prin gheață:",o:["alerg pe gheață până la ea","întind un obiect lung (scară, prăjină), arunc echipament de plutire; dacă trebuie să merg, mă leg cu frânghie de mal și mă târăsc culcat pe burtă","sar în apă după ea","aștept primăvara"],a:[1],e:"Culcat, greutatea se repartizează pe o suprafață mai mare. Atenție la hipotermie, atât pentru victimă, cât și pentru salvatori.",r:"16.2 Apă înghețată"},
{q:"Un muncitor a leșinat într-un bazin sau o cisternă. Colegul vrea să intre după el. Ce îi spuneți?",o:["„Du-te repede!”","Nimeni nu intră fără aparat de respirat: riscul e lipsa oxigenului sau un gaz toxic. Chemăm echipa specializată.","„Intră ținându-ți respirația”","„Aruncă-i apă”"],a:[1],e:"Cine intră fără protecție respiratorie devine a doua victimă.",r:"16.2 Spații închise"}
],
cases:[
{title:"Mașină în șanț, cablu căzut",intro:"Noapte. Un autoturism a lovit un stâlp și stă pe roți în șanț. Un cablu electric atârnă peste capotă. Șoferul e conștient și vrea să iasă. De sub capotă iese ceva alb.",vitals:["Victimă conștientă","Cablu peste vehicul","Abur/fum?"],
steps:[
{q:"Ce îi spuneți șoferului?",o:[
{t:"Să rămână în mașină și să nu atingă nimic din exterior; chem pompierii și compania de electricitate, îndepărtez privitorii la cel puțin 50 m",ok:1,f:"Corect. Ieșind, ar putea face contact simultan cu caroseria și solul."},
{t:"Să sară repede afară",ok:0,f:"Riscul de electrocutare e foarte mare. Victima rămâne în vehicul până se întrerupe curentul."}]},
{q:"Aburul alb se risipește imediat lângă mașină. Ce concluzionați?",o:[
{t:"Probabil vapori de la radiatorul spart, nu incendiu; continui să monitorizez",ok:1,f:"Corect. Fumul de incendiu nu se risipește în ~1 m."},
{t:"E incendiu, sparg geamul și îl scot",ok:0,f:"Nu e semn clar de incendiu, iar cablul e încă sub tensiune."}]},
{q:"Curentul a fost întrerupt. Ce faceți înainte de a deschide mașina?",o:[
{t:"Stabilizez vehiculul (pene la roți), opresc contactul, deconectez bateria (întâi borna negativă), verific poziția airbagurilor nedeclanșate",ok:1,f:"Corect. Vehiculul se stabilizează chiar dacă e pe 4 roți."},
{t:"Deschid portiera cu hidraulicul",ok:0,f:"Întâi stabilizare și siguranță. Și încercați toate portierele înainte de echipament."}]},
{q:"Șoferul acuză durere cervicală. Semne vitale stabile. Extracție?",o:[
{t:"Cap în ax, guler, KED (3 salvatori), apoi extragere pe bord și saltea vacuum",ok:1,f:"Corect. Extracția de urgență e doar pentru incendiu sau stop cardio-respirator."},
{t:"Extracție de urgență, ca să terminăm repede",ok:0,f:"Nu e indicată: pacientul e stabil, iar mișcarea coloanei poate produce paralizie."}]}
],
take:["Cablu peste mașină: victima rămâne înăuntru, privitorii la 50 m.","Stabilizare întotdeauna, chiar pe 4 roți.","Bateria deconectată nu elimină riscul airbagurilor.","KED pentru pacientul stabil; extracție de urgență doar la foc sau stop."]}
]

CHAPTERS.push({
id:17, title:"Incidente cu risc de contaminare (CBRN)", pages:"427–443",
keypoints:[
"CBRN = Chimic, Biologic, Radiologic, Nuclear. Priorități: decontaminare de urgență și protecția căilor respiratorii, apoi decontaminarea completă, apoi avertizarea și evacuarea populației din jur.",
"Zonele de acțiune: ROȘIE (fierbinte, de excludere): risc maxim, doar personal specializat. PORTOCALIE (controlată): activități scurte (triaj, decontaminare), cu un singur punct de intrare/ieșire. VERDE (de sprijin): în afara pericolului, aici sunt comanda, rezervele și asistența medicală din Planul Roșu.",
"Zona letală: inhalarea omoară în cel mult 15 minute. Zona de intoxicare: 1–5 minute de expunere cer tratament. Norul toxic se deplasează cu vântul (formă tronconică; pe vreme calmă, emisferică).",
"Apropierea se face ÎNTOTDEAUNA cu vântul din spate. Perimetru de securitate cu un singur punct de intrare/ieșire. Niciodată o singură persoană în intervenție.",
"Dacă aparatele nu detectează nimic, asta nu exclude pericolul. Decizia ia în calcul și informațiile, scena, simptomele victimelor (mai multe persoane sau animale cu aceleași simptome) și plăcuțele.",
"Plăcuța portocalie: numărul de pericol (sus) și numărul ONU (jos). Un X în cod înseamnă că substanța reacționează violent cu apa. Plăcuța portocalie fără cifre: mai multe substanțe periculoase. Documentele de transport și fișele de securitate se află obligatoriu în cabină.",
"Riscul medical primează asupra riscului de contaminare: reanimarea primează decontaminării. Protejați căile aeriene ale victimei (mască de hârtie sau oxigen).",
"Intoxicațiile cu gaze iritante au o perioadă de latență până la edemul pulmonar: victima nu face efort și e monitorizată.",
"Decontaminarea de urgență: „uscată” (pudră, hârtie), dezbrăcare de sus în jos (îndepărtează mare parte din contaminant). Decontaminarea completă („umedă”): dușuri cu apă la 30–35°C și săpun, clătire, uscare prin tamponare.",
"Radiologic: stați cât mai departe de sursă, folosiți ecrane (ziduri, mașini), ARI obligatoriu, evitați apa, opriți ventilația ambulanței. Victima se scoate rapid doar dacă dozimetrul sună continuu.",
"Butelie sau rezervor GPL în pericol: perimetru de minim 50 m; cisternă: 500 m. Decolorarea rapidă a recipientului anunță o explozie iminentă.",
"Atentat: pot exista dispozitive secundare care țintesc salvatorii. Intrați doar ca să salvați vieți, cu cât mai puțini oameni și cât mai puțin timp."
],
questions:[
{q:"Ce înseamnă CBRN?",o:["Chimic, Biologic, Radiologic, Nuclear","Centrul Bucureștean de Resuscitare Națională","Cardio, Bronhii, Respirație, Neurologie","Cod, Bandaj, Reanimare, Neutralizare"],a:[0],e:"",r:"17.1"},
{q:"Din ce direcție vă apropiați de un incident chimic în aer liber?",o:["cu vântul din spate","cu vântul din față","din direcția în care merge norul","nu contează"],a:[0],e:"Norul toxic e purtat de vânt. Cu vântul din față, intrați direct în el.",r:"17 Listă de verificare"},
{q:"În ce zonă se află punctul de comandă și asistența medicală din Planul Roșu?",o:["zona roșie (de excludere)","zona portocalie (controlată)","zona verde (de sprijin)","în focarul chimic"],a:[2],e:"Zona verde e în afara arealului periculos.",r:"17.1 Zone de acțiune"},
{q:"Zona roșie (fierbinte / de excludere):",o:["risc major; e delimitată și controlată de personal specializat, care extrage victimele și neutralizează sursa","o zonă în care paramedicii intră liber, fără echipament","zona de decontaminare","parcarea ambulanțelor"],a:[0],e:"Ieșirea din zona roșie se face doar după controlul contaminării de către specialiști.",r:"17.1"},
{q:"Ce e zona letală a norului toxic?",o:["zona în care inhalarea produce moartea în cel mult 15 minute","zona cu miros neplăcut","zona în care e nevoie de tratament după 1–5 minute","zona din spatele vântului"],a:[0],e:"Zona de intoxicare: 1–5 minute de expunere produc intoxicare care cere tratament.",r:"17.1"},
{q:"Detectorul nu arată nimic, dar trei persoane ieșite din clădire au aceleași simptome (lăcrimare, tuse, vărsături). Ce concluzionați?",o:["e sigur, aparatul nu arată nimic","suspectez o substanță periculoasă: aparatele nu sunt singurul criteriu, iar simptomele identice la mai multe persoane sunt un semnal de alarmă","e o toxiinfecție alimentară, intru","îi chem pe toți în ambulanță"],a:[1],e:"Dacă aparatele nu detectează nimic, asta nu împiedică o decizie care pune pe primul loc siguranța personalului.",r:"17.1 Evaluarea riscului"},
{q:"Semne că poate exista un nor sau o atmosferă toxică (alege toate):",o:["fum de culoare sau miros suspect (mirosul nu e neapărat neplăcut)","oameni sau animale cu simptome identice","simptomele pot apărea cu întârziere, de la minute la ore","lipsa mirosului exclude pericolul"],a:[0,1,2],e:"",r:"17 Gaze și vapori toxici"},
{q:"Pe plăcuța portocalie a unei cisterne, codul de pericol conține litera X. Ce înseamnă?",o:["substanța reacționează violent cu apa","substanța e inofensivă","cisterna e goală","substanță radioactivă"],a:[0],e:"Nu folosiți apă fără avizul specialiștilor. Plăcuța portocalie fără cifre înseamnă mai multe substanțe periculoase.",r:"17 Transport materiale periculoase"},
{q:"Unde găsiți documentele de transport și fișele de securitate ale unei substanțe periculoase?",o:["obligatoriu în cabina vehiculului","la poliție","doar la firma expeditoare","nu există"],a:[0],e:"Primul comandant sosit dispune recuperarea lor, pentru informare.",r:"17"},
{q:"Victimă contaminată chimic, în stop cardio-respirator. Ce are prioritate?",o:["decontaminarea completă, apoi RCP","reanimarea primează decontaminării: riscul medical are prioritate, iar personalul medical stă cât mai aproape de zona contaminată","o lăsăm, e contaminată","doar antidotul"],a:[1],e:"Pentru cei la care întârzierea ar fi fatală: linie venoasă, antidot (dacă e cunoscut), intubație după o decontaminare superficială a feței (mănușă și pudră), ventilație.",r:"17 Preluarea victimei din mediul chimic"},
{q:"Ce faceți imediat pentru căile aeriene ale unei victime contaminate?",o:["le protejez cu o mască de hârtie sau prin oxigenoterapie","nimic","îi dau apă de băut","îi spăl fața cu multă apă, oricare ar fi substanța"],a:[0],e:"",r:"17"},
{q:"Pacient expus la un gaz iritant, acum fără simptome. Ce e important?",o:["îl trimit acasă","există o perioadă de latență până la edemul pulmonar: nu face efort, e monitorizat și anunțăm spitalul despre substanță","îl pun să alerge, să vadă dacă se sufocă","doar îl dezbrac"],a:[1],e:"Transmiteți la spital informațiile despre substanță, ca să se asigure antidotul.",r:"17"},
{q:"Decontaminarea de urgență a victimelor (accident chimic) presupune: (alege toate)",o:["decontaminare „uscată”: pudră sau hârtie aplicată cu mănușa","dezbrăcarea hainelor de deasupra și a pantofilor, de sus în jos","câte o mască pentru fiecare victimă","duș cu apă rece, cu presiune mare, pentru toată lumea, înainte de dezbrăcare"],a:[0,1,2],e:"Se păstrează un minim de haine, iar victimele se îmbracă cu un chit sau o pătură.",r:"17 Decontaminarea"},
{q:"Decontaminarea completă („umedă”): ce e corect?",o:["duș cu apă la 30–35°C și substanțe tensioactive, ~1 minut (2 cicluri pentru părul lung), clătire, uscare prin tamponare","apă rece cu jet puternic","frecare cu peria până la sânge","se face la toți, obligatoriu, înainte de orice"],a:[0],e:"Apa rezultată se colectează și se tratează. Ideal sunt două linii: pentru victime valide și pentru invalide.",r:"17"},
{q:"De ce stau victimele contaminate grupate, fără contact între ele și cu personalul?",o:["pentru statistici","pentru a limita „transferul de contaminare”","ca să nu vorbească între ele","nu e necesar"],a:[1],e:"",r:"17"},
{q:"Urgență radiologică. Ce reguli aplică personalul medical? (alege toate)",o:["stau cât mai departe de sursă și folosesc ecranele din jur (ziduri, mașini)","ARI obligatoriu","evit pe cât posibil folosirea apei","opresc ventilația ambulanței care evacuează aer spre exterior"],a:[0,1,2,3],e:"Recunoașterea se face cu un număr minim de persoane; un binom cu dozimetru poate face măsurători.",r:"17 Urgență radiologică"},
{q:"Când e important să scoateți RAPID o victimă dintr-un mediu contaminat radiologic, chiar cu riscul de a-i agrava starea?",o:["întotdeauna","doar când dozimetrul indică un semnal de alarmă continuu","niciodată","doar noaptea"],a:[1],e:"În rest, victima e tratată după starea ei (chiar stabilizată pe loc dacă e încarcerată), dar nu e ținută mult lângă sursă.",r:"17"},
{q:"Iradiere puternică: ce perimetru de securitate se organizează, minim?",o:["o încăpere","raza de minim 100 m","10 m","1 km obligatoriu"],a:[1],e:"Iradierea redusă se limitează la o încăpere, o locuință sau un vehicul.",r:"17"},
{q:"Un rezervor GPL al unei mașini e în pericol de explozie. Ce perimetru stabiliți? Și pentru o cisternă?",o:["5 m / 50 m","minim 50 m / 500 m","100 m / 100 m","nu e nevoie"],a:[1],e:"Decolorarea rapidă a recipientului indică o explozie iminentă.",r:"17 Particularități"},
{q:"Acid deversat în canalizare. Ce risc apare?",o:["niciunul","formarea de gaze toxice (de exemplu hidrogen sulfurat, mortal); iar acid plus metal degajă hidrogen exploziv","doar mirosul","apa diluează totul"],a:[1],e:"",r:"17 Produse corozive"},
{q:"Explozie suspectă într-un loc public. Ce trebuie să aveți în minte? (alege toate)",o:["pot exista dispozitive secundare care țintesc salvatorii","intrăm în zonă doar ca să salvăm vieți, cu cât mai puțini oameni și cât mai puțin timp","explozia poate răspândi agenți chimici, biologici sau radiologici","intrăm imediat în clădirile avariate"],a:[0,1,2],e:"Este interzisă intrarea salvatorilor în clădiri nesigure.",r:"17 Atacuri teroriste"},
{q:"Ce comunicați spitalelor într-un incident chimic? (alege toate)",o:["agentul cunoscut sau suspectat, ca să se pregătească antidoturile","că victimele contaminate pot veni singure la spital","numărul de victime","nimic, ca să nu creăm panică"],a:[0,1,2],e:"",r:"17"},
{q:"Cine are voie să iasă din zona contaminată (roșu → portocaliu)?",o:["oricine, oricând","personalul doar după controlul contaminării făcut de specialiști, prin punctul de control/SAS","doar victimele","nimeni, niciodată"],a:[1],e:"Nu vă dezbrăcați de echipament, nu mâncați și nu beți până la controlul contaminării.",r:"17"}
],
cases:[
{title:"Cisternă răsturnată, oameni care tușesc",intro:"Ajungeți primii la o cisternă răsturnată pe un drum județean. Se vede un nor ușor gălbui. Doi oameni lângă un autoturism tușesc, lăcrimează și au dificultăți la respirație. Vântul bate dinspre cisternă spre voi.",vitals:["Nor vizibil","Vânt spre echipaj","2 victime simptomatice"],
steps:[
{q:"Ce faceți primul?",o:[
{t:"Mă retrag și repoziționez ambulanța cu vântul din spate, la distanță; anunț dispeceratul: posibil incident chimic, cer pompieri/CBRN",ok:1,f:"Corect. Siguranța proprie și apropierea cu vântul din spate."},
{t:"Merg repede la victime, sunt doar la 30 m",ok:0,f:"Intrați direct în nor și deveniți victime."}]},
{q:"Cum aflați ce substanță e implicată?",o:[
{t:"Plăcuța portocalie (cu binoclul, de la distanță), șoferul, documentele din cabină și fișa de securitate (recuperate de cei echipați), dispeceratul, ghidul ERG",ok:1,f:"Corect. Numărul ONU vă dă informații despre substanță și distanțele de izolare (paginile verzi)."},
{t:"Mă apropii să miros",ok:0,f:"Mirosul nu e un criteriu sigur, iar expunerea vă poate intoxica."}]},
{q:"Victimele sunt aduse spre voi de cei echipați. Ce faceți?",o:[
{t:"Protecție respiratorie pentru ele (mască sau oxigen), decontaminare uscată, dezbrăcare de sus în jos, apoi evaluare ABC",ok:1,f:"Corect. Dezbrăcarea îndepărtează o mare parte din contaminant."},
{t:"Le urc direct în ambulanță, îmbrăcate",ok:0,f:"Contaminați ambulanța și echipajul."}]},
{v:["Victima 1","FR 28, SpO₂ 92%"],q:"Una dintre victime se simte mai bine după oxigen și vrea să plece acasă. Ce îi spuneți?",o:[

<script>

  document.getElementById('bk').onclick=home;
  document.getElementById('mQ').onclick=()=>runQuiz({title:`Cap. ${c.id} · ${c.title}`, items:shuffle(c.questions).map(q=>({...q,ch:c.id})), chId:id, instant:true});
  const mC=document.getElementById('mC'); if(mC) mC.onclick=()=>runCase(c,0);
}

/* ---------- Quiz ---------- */
function runQuiz(cfg){
  let i=0, answers=[];
  const items = cfg.items.map(q=>{
    // amestecă variantele, păstrând corespondența răspunsurilor
    const order = shuffle(q.o.map((_,k)=>k));
    return {...q, o:order.map(k=>q.o[k]), a:q.a.map(k=>order.indexOf(k)).sort()};
  });
  homeBtn.hidden=false; view='quiz';
  function show(){
    const q = items[i]; setProgress(i/items.length); top();
    const multi = q.a.length>1;
    let sel = new Set();
    app.innerHTML = `
    <button class="back" type="button" id="bk">← Renunță</button>
    <div class="card">
      <div class="qmeta"><span>${esc(cfg.title)}</span><span>Întrebarea ${i+1} din ${items.length}</span></div>
      <div>${q.m?'<span class="multi src">Din manual</span> ':''}${multi?'<span class="multi">Mai multe variante corecte</span>':''}<div class="qtext">${q.q}</div></div>
      <div class="opts">${q.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="l">${LET[k]}</span><span>${o}</span></button>`).join('')}</div>
      <div id="fbx"></div>
      <div class="actions"><button class="btn" id="go" type="button" disabled>Verifică</button></div>
    </div>`;
    document.getElementById('bk').onclick = ()=> cfg.chId? chapter(cfg.chId) : home();
    const btns=[...app.querySelectorAll('.opt')], go=document.getElementById('go');
    btns.forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(multi){ sel.has(k)?sel.delete(k):sel.add(k) } else { sel=new Set([k]) }
      btns.forEach(x=>x.classList.toggle('sel', sel.has(+x.dataset.k)));
      go.disabled = sel.size===0;
    });
    let checked=false;
    go.onclick=()=>{
      if(!checked){
        const pick=[...sel].sort(); const ok = pick.length===q.a.length && pick.every((v,j)=>v===q.a[j]);
        answers[i]={ok,pick};
        if(cfg.instant){
          checked=true;
          btns.forEach(x=>{ const k=+x.dataset.k; x.disabled=true; x.classList.remove('sel');
            if(q.a.includes(k)) x.classList.add(sel.has(k)?'right':'missed'); else if(sel.has(k)) x.classList.add('wrong'); });
          document.getElementById('fbx').innerHTML = `<div class="fb ${ok?'ok':'no'}"><b class="v">${ok?'Corect':'Greșit'}</b><p>${q.e}</p>${q.r?`<span class="ref">Manual: ${esc(q.r)}</span>`:''}</div>`;
          go.textContent = i<items.length-1?'Următoarea':'Vezi rezultatul';
        } else next();
      } else next();
    };
  }
  function next(){ i++; if(i<items.length) show(); else finish(); }
  function finish(){
    setProgress(1); top();
    const right = answers.filter(a=>a&&a.ok).length, pct=Math.round(right/items.length*100);
    logEntry(cfg.chId?('q'+cfg.chId):'exam', pct, {r:right, of:items.length});
    if(cfg.chId){ const k='q'+cfg.chId; const s=store[k]||{best:0,n:0}; s.best=Math.max(s.best,pct); s.n++; s.last=pct; store[k]=s; save(); }
    else { const s=store.exam||{best:0,n:0}; s.best=Math.max(s.best,pct); s.n++; store.exam=s; save(); }
    const verdict = pct>=90?'Foarte bine, stăpânești capitolul.':pct>=70?'Bine. Recitește explicațiile la ce ai greșit.':pct>=50?'Ai bazele, dar mai e de lucru. Recitește capitolul.':'Reia capitolul din manual și refă testul.';
    const wrong = items.map((q,k)=>({q,a:answers[k]})).filter(x=>!x.a.ok);
    const nm=getName(); const d=new Date();
    app.innerHTML = `
    <div class="card">
      <div class="result">
        <div class="eyebrow">${esc(cfg.title)}</div>
        <div class="big" style="color:var(--${pct>=70?'ok':pct>=50?'amber':'bad'})">${pct}%</div>
        <div class="verdict">${right} din ${items.length} corecte</div>
        <div class="muted">${verdict}</div>
        <div class="toast">${nm?esc(nm)+' · ':''}${d.toLocaleDateString('ro-RO')} ${d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="again" type="button">Reia testul</button>
        <button class="btn ghost" id="out" type="button">${cfg.chId?'Înapoi la capitol':'Înapoi la capitole'}</button>
      </div>
    </div>
    ${wrong.length?`<h3 style="margin-top:26px">De recitit (${wrong.length})</h3><div class="review">${wrong.map(({q,a})=>`
      <div class="rv"><div><b>${q.q}</b></div>
      <div class="y">Ai ales: ${a.pick.map(k=>q.o[k]).join('; ')||'—'}</div>
      <div class="a">Corect: ${q.a.map(k=>q.o[k]).join('; ')}</div>
      <div class="muted">${q.e}</div>${q.r?`<div class="ref">Manual: ${esc(q.r)}${cfg.chId?'':` · cap. ${q.ch}`}</div>`:''}</div>`).join('')}</div>`:''}`;
    document.getElementById('again').onclick=()=> cfg.chId? runQuiz({...cfg, items:shuffle(cfg.items)}) : startExam();
    document.getElementById('out').onclick=()=> cfg.chId? chapter(cfg.chId) : home();
  }
  show();
}
function startExam(){
  const pool=[]; CH.forEach(c=>c.questions.forEach(q=>pool.push({...q,ch:c.id})));
  runQuiz({title:'Examen general', items:shuffle(pool).slice(0,30), instant:false});
}

/* ---------- Rezultatele colegilor (doar proprietarul) ---------- */
function fmtD(t){ if(!t) return '—'; const d=new Date(t); return d.toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}); }
function entryLabel(k){ if(k==='exam') return 'Examen general'; let m=/^q(\d+)$/.exec(k); if(m){const c=CH.find(x=>x.id==m[1]); return 'Cap. '+m[1]+(c?' · '+c.title:'');} m=/^c(\d+)_(\d+)$/.exec(k); if(m){const c=CH.find(x=>x.id==m[1]); const cs=c&&c.cases[+m[2]]; return 'Caz · cap. '+m[1]+(cs?' · '+cs.title:'');} return k; }
function results(){
  homeBtn.hidden=false; setProgress(0); top(); view='results';
  app.innerHTML = `<button class="back" type="button" id="bk">← Toate capitolele</button>
    <section class="chhead"><div class="eyebrow">Doar tu vezi această pagină</div><h1>Rezultatele colegilor</h1>
    <div class="muted">Se actualizează singură când cineva termină un test.</div></section>
    <div id="rl"><p class="muted">Se încarcă…</p></div>`;
  document.getElementById('bk').onclick=home;
  const rl=document.getElementById('rl'); let open=null, docs=[];
  async function paint(){
    if(!docs.length){ rl.innerHTML='<p class="muted">Încă nu a trimis nimeni rezultate. Apar aici după ce colegii termină primul test.</p>'; return; }
    let ps={}; try{ ps = await cloud.user.profiles(docs.map(d=>d.id)); }catch(e){}
    const rows = docs.map(sn=>{ const d=sn.data()||{}; const sc=d.scores||{};
      const qs=CH.filter(c=>sc['q'+c.id]); const avg=qs.length?Math.round(qs.reduce((s,c)=>s+(sc['q'+c.id].best||0),0)/qs.length):null;
      const nm=(d.name||'').trim() || (ps[sn.id]&&ps[sn.id].name) || 'Fără nume';
      return {id:sn.id, nm, me:sn.id===cloud.uid, sc, qs:qs.length, avg, ex:sc.exam?sc.exam.best:null, upd:d.updated||0, log:Array.isArray(d.log)?d.log:[]}; })
      .sort((a,b)=>b.upd-a.upd);
    rl.innerHTML = `<div class="stats"><div class="stat"><b>${rows.length}</b><span>persoane</span></div>
      <div class="stat"><b>${rows.filter(r=>r.avg!==null).length?Math.round(rows.filter(r=>r.avg!==null).reduce((s,r)=>s+r.avg,0)/rows.filter(r=>r.avg!==null).length)+'%':'—'}</b><span>media pe capitole</span></div></div>
      <div class="chapters">${rows.map(r=>`
      <div class="person${open===r.id?' open':''}">
        <button class="ch" type="button" data-p="${esc(r.id)}"><div class="num" style="font-size:20px">${r.avg!==null?r.avg+'%':'–'}</div>
          <div class="t"><b>${esc(r.nm)}${r.me?' (tu)':''}</b><span>${r.qs}/${CH.length} capitole · examen ${r.ex!==null?r.ex+'%':'—'} · ${fmtD(r.upd)}</span></div>
          </button>
        ${open===r.id?`<div class="pdet">
          <h3>Pe capitole (cel mai bun scor)</h3>
          <div class="grid">${CH.map(c=>{const s=r.sc['q'+c.id]; return `<div class="cell ${s?pillClass(s.best):''}"><b>${c.id}</b><span>${s?s.best+'%':'—'}</span></div>`}).join('')}</div>
          <h3>Ultimele teste</h3>
          ${r.log.length?`<ul class="loglist">${r.log.slice(0,15).map(l=>`<li><span>${esc(entryLabel(String(l.t)))}</span><b>${Number(l.pct)||0}%</b><i>${fmtD(l.d)}</i></li>`).join('')}</ul>`:'<p class="muted">Fără detalii.</p>'}
        </div>`:''}
      </div>`).join('')}</div>`;
    rl.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ open = open===b.dataset.p?null:b.dataset.p; paint(); });
  }
  try{
    unsubRes = cloud.db.collection('results').onSnapshot(snap=>{ docs=snap.docs.filter(d=>d.exists); paint(); },
      ()=>{ rl.innerHTML='<p class="muted">Rezultatele nu pot fi încărcate acum. Revino mai târziu.</p>'; });
  }catch(e){ rl.innerHTML='<p class="muted">Rezultatele nu pot fi încărcate acum.</p>'; }
}

/* ---------- Cazuri ---------- */
function runCase(c, idx){
  const cs = c.cases[idx]; let step=0, score=0; homeBtn.hidden=false; view='case';
  function render(){
    setProgress(step/cs.steps.length); top();
    const st = cs.steps[step];
    app.innerHTML = `
    <button class="back" type="button" id="bk">← Capitolul ${c.id}</button>
    <div class="card">
      <div class="qmeta"><span>Caz ${idx+1} din ${c.cases.length} · ${esc(cs.title)}</span><span>Pasul ${step+1} din ${cs.steps.length}</span></div>
      ${step===0?`<div class="scene"><div class="eyebrow">Apelul</div><p>${cs.intro}</p>${cs.vitals?`<div class="vitals">${cs.vitals.map(v=>`<span>${v}</span>`).join('')}</div>`:''}</div>`:''}
      ${st.s?`<div class="scene"><div class="eyebrow">Evoluție</div><p>${st.s}</p>${st.v?`<div class="vitals">${st.v.map(v=>`<span>${v}</span>`).join('')}</div>`:''}</div>`:''}
      <div class="qtext">${st.q}</div>
      <div class="opts">${st.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="l">${LET[k]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div id="fbx"></div>
      <div class="actions" id="act"></div>
    </div>`;
    document.getElementById('bk').onclick=()=>chapter(c.id);
    const btns=[...app.querySelectorAll('.opt')];
    let first=true;
    btns.forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, o=st.o[k];
      if(first){ if(o.ok) score++; first=false; }
      b.classList.add(o.ok?'right':'wrong'); b.disabled=true;
      document.getElementById('fbx').innerHTML=`<div class="fb ${o.ok?'ok':'no'}"><b class="v">${o.ok?'Decizie corectă':'Nu e cea mai bună decizie'}</b><p>${o.f}</p>${!o.ok?'<span class="ref">Încearcă altă variantă.</span>':''}</div>`;
      if(o.ok){
        btns.forEach(x=>x.disabled=true);
        document.getElementById('fbx').innerHTML += st.d?`<div class="discuss" style="margin-top:10px"><b>Discuție</b><div>${st.d}</div></div>`:'';
        document.getElementById('act').innerHTML=`<button class="btn" id="nx" type="button">${step<cs.steps.length-1?'Continuă':'Încheie cazul'}</button>`;
        document.getElementById('nx').onclick=()=>{ step++; step<cs.steps.length?render():end(); };
      }
    });
  }
  function end(){
    setProgress(1); top();
    const k='c'+c.id+'_'+idx; logEntry(k, Math.round(score/cs.steps.length*100), {r:score, of:cs.steps.length}); store[k]=Math.max(store[k]||0, score); save();
    app.innerHTML=`
    <button class="back" type="button" id="bk">← Capitolul ${c.id}</button>
    <div class="card">
      <div class="eyebrow">Caz încheiat · ${esc(cs.title)}</div>
      <h2>${score} din ${cs.steps.length} decizii corecte din prima</h2>
      <div class="discuss"><b>De reținut din acest caz</b><ul>${cs.take.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      <div class="actions">
        ${idx<c.cases.length-1?`<button class="btn" id="nc" type="button">Cazul următor</button>`:''}
        <button class="btn ghost" id="rc" type="button">Reia cazul</button>
      </div>
    </div>`;
    document.getElementById('bk').onclick=()=>chapter(c.id);
    document.getElementById('rc').onclick=()=>runCase(c,idx);
    const nc=document.getElementById('nc'); if(nc) nc.onclick=()=>runCase(c,idx+1);
  }
  render();
}
home();
cloudInit();
})();
</script>
